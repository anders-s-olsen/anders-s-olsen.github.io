bio: |

  I am a postdoc at the [Neurobiology Research Unit](https://nru.dk/), Rigshospitalet, Copenhagen, where I develop mathematical and computational tools for functional neuroimaging. My work combines unsupervised machine learning, directional statistics, and signal processing, and I apply it to fMRI, EEG/MEG, PET, SPECT, and ASL data from healthy participants, altered states of consciousness, and patient groups.

  **Directional statistics and brain dynamics.** A central thread of my work is building statistical models that respect the geometry of neuroimaging data — phases, unit-norm and sign-invariant vectors, and low-rank matrices. During my PhD at DTU Compute with [Prof. Morten Mørup](https://mortenmorup.dk/), I developed mixture models of complex-valued phase coherence for dynamic functional connectivity in fMRI and released them as an open-source toolbox ([PNAS, 2026](https://doi.org/10.1073/pnas.2518287123)). Together with Profs Kanti V. Mardia, Dimitri Van De Ville, and Morten Mørup, I recently wrote a geometry-driven overview of directional statistics across signal processing ([arXiv, 2026](https://arxiv.org/abs/2611.04595)). 

  **Sleep, cerebrospinal fluid, and glymphatic physiology.** I analyse fast fMRI to study how sleep and sleep deprivation modulate vasomotion and cardiac- and respiration-driven brain pulsations ([PLOS Biology, 2025](https://doi.org/10.1371/journal.pbio.3003500)). For dynamic SPECT imaging of cerebrospinal-fluid tracers in pigs, I have developed a shift- and stretch-invariant matrix factorization for delineating brain tissue ([ICASSP, 2026](https://doi.org/10.48550/arXiv.2604.08161)) and contributed to kinetic modelling of CSF–brain tracer exchange ([bioRxiv, 2026](https://doi.org/10.64898/2026.08.24.746655)). Ongoing work extends this to patients with normal pressure hydrocephalus and idiopathic intracranial hypertension.

  **Psychedelics and consciousness.** I study how psilocybin alters brain activity and connectivity, using dynamic connectivity models ([NeuroImage, 2022](https://doi.org/10.1016/j.neuroimage.2022.119716)), a systematic comparison of fMRI brain-entropy metrics with an accompanying toolbox ([Nature Communications, 2026](https://doi.org/10.1038/s41467-026-74215-5)), and frequency-resolved spectral analysis of BOLD signals ([bioRxiv, 2026](https://doi.org/10.64898/2026.04.09.717379)). During a secondment at the Rigshospitalet Neuro-ICU with Prof. Daniel Kondziella, I analysed EEG from comatose patients receiving psilocybin.

  **Earlier work** includes methods for fusing EEG and MEG across subjects and modalities ([EUSIPCO](https://doi.org/10.23919/EUSIPCO63174.2024.10715032), [Frontiers in Neuroscience, 2022](https://doi.org/10.3389/fnins.2022.911034)) and, with the [lab of Prof. Dimitri Van De Ville](https://miplab.epfl.ch/) in Geneva, work on how cortical geometry and structural connectivity constrain functional brain maps ([ISBI, 2025](https://doi.org/10.1109/ISBI60581.2025.10980669)).

  A full list of publications is available [here](https://scholar.google.com/citations?user=lsFNPU0AAAAJ&hl=en).

